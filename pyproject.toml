[build-system]
requires = [
  "setuptools >= 82",
  "setuptools-scm >= 8.0",
]

[project]
name = "wasmpy-build"
readme = "README.md"
classifiers = [
  "Programming Language :: C",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Environment :: WebAssembly",
  "Environment :: WebAssembly :: WASI",
]
dependencies = [
  "appdirs",
  "requests",
  "setuptools >= 66.1.0",
  "tqdm",
]
description = "WebAssembly build tool for CPython C/C++ extensions"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">= 3.6"
keywords = ["wasmpy", "webassembly", "wasm", "wasi"]

[[project.authors]]
name = "Olivia Ryan"
email = "olivia.r.dev@gmail.com"

[project.urls]
"Issues" = "https://github.com/olivi-r/wasmpy-build/issues"
"Repository" = "https://github.com/olivi-r/wasmpy-build"

[project.scripts]
wasmpy-build = "wasmpy_build.cli:buildc"
"wasmpy-build++" = "wasmpy_build.cli:buildcpp"
wasmpy-build-cpp = "wasmpy_build.cli:buildcpp"

[tool.setuptools]
packages = ["wasmpy_build"]

[tool.setuptools_scm]
